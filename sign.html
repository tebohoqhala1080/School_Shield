<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — SchoolShield</title>
<link rel="stylesheet" href="stylesheet.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="brand" aria-label="Return to the SchoolShield home page">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 4 5.5v5.2c0 5.1 3.4 8.9 8 10.3 4.6-1.4 8-5.2 8-10.3V5.5L12 2z"/>
      <path d="M12 9.5 6.5 11.8 12 14l5.5-2.2L12 9.5z" fill="#2563eb" stroke="none"/>
      <path d="M8.7 12.8v2.1c0 .9 1.5 1.6 3.3 1.6s3.3-.7 3.3-1.6v-2.1" fill="none"/>
    </svg>
    <span>School<span class="accent">Shield</span></span>
  </a>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="signInForm" novalidate>
    <h1>Sign in</h1>
    <p class="auth-subtitle">Access your school's SchoolShield dashboard.</p>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@school.edu" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary">Sign In</button>

    <a href="#" class="forgot-link">Forgot password?</a>
  </form>

  <p class="auth-footer">New to SchoolShield? <a href="register.html">Register your school</a></p>
</main>

<script src="sign.js"></script>
</body>
</html>
