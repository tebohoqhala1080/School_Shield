<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchoolShield — Visitor Management for Schools</title>
<link rel="stylesheet" href="stylesheet.css">
</head>
<body>

<div class="wrap">
  <div class="logo">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 4 5.5v5.2c0 5.1 3.4 8.9 8 10.3 4.6-1.4 8-5.2 8-10.3V5.5L12 2z"/>
      <path d="M12 9.5 6.5 11.8 12 14l5.5-2.2L12 9.5z" fill="#2563eb" stroke="none"/>
      <path d="M8.7 12.8v2.1c0 .9 1.5 1.6 3.3 1.6s3.3-.7 3.3-1.6v-2.1" fill="none"/>
    </svg>
  </div>

  <h1>Welcome to SchoolShield</h1>
  <p class="subtitle">A smart and secure visitor management system for schools.</p>

  <div class="actions">
    <button class="btn btn-primary" id="signInBtn">Sign In</button>
    <button class="btn btn-secondary" id="registerBtn">Register School</button>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5l-8-3z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <h3>Secure by design</h3>
      <p>Visitor records kept safe and private.</p>
    </div>

    <div class="card">
      <div class="card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="12" height="17" rx="2"/>
          <path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1z"/>
          <path d="M9 13l2 2 4-4"/>
        </svg>
      </div>
      <h3>No more paper</h3>
      <p>Digital sign-in replaces the register.</p>
    </div>

    <div class="card">
      <div class="card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/>
          <circle cx="10" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <h3>Built for schools</h3>
      <p>Made for reception desks and gates.</p>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
