<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register your school — SchoolShield</title>
<link rel="stylesheet" href="stylesheet.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="brand" aria-label="Return to the SchoolShield home page">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 4 5.5v5.2c0 5.1 3.4 8.9 8 10.3 4.6-1.4 8-5.2 8-10.3V5.5L12 2z"/>
      <path d="M12 9.5 6.5 11.8 12 14l5.5-2.2L12 9.5z" fill="#2563eb" stroke="none"/>
      <path d="M8.7 12.8v2.1c0 .9 1.5 1.6 3.3 1.6s3.3-.7 3.3-1.6v-2.1" fill="none"/>
    </svg>
    <span>School<span class="accent">Shield</span></span>
  </a>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="registerForm" novalidate>
    <h1>Register your school</h1>
    <p class="auth-subtitle">Set up your school account to get started with SchoolShield.</p>

    <div class="field">
      <label for="schoolName">School name</label>
      <input type="text" id="schoolName" name="schoolName" placeholder="Greenfield Primary School" required>
    </div>

    <div class="field">
      <label for="principalName">Principal name</label>
      <input type="text" id="principalName" name="principalName" placeholder="Jane Mokoena" required>
    </div>

    <div class="field">
      <label for="schoolEmail">School email</label>
      <input type="email" id="schoolEmail" name="schoolEmail" placeholder="admin@school.edu" required>
    </div>

    <div class="field">
      <label for="phoneNumber">Phone number</label>
      <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+27 11 555 0123" required>
    </div>

    <div class="field">
      <label for="address">Physical address</label>
      <textarea id="address" name="address" placeholder="12 Oak Avenue, Johannesburg" required></textarea>
    </div>

    <div class="field">
      <label for="password">Create password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8">
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required minlength="8">
    </div>

    <button type="submit" class="btn btn-primary">Register</button>
  </form>

  <p class="auth-footer">Already registered? <a href="sign-in.html">Sign in</a></p>
</main>

<script src="register.js"></script>
</body>
</html>
